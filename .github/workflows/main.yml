name: emuscd CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ '*' ]
  create:
      tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  cxx: g++,      cc: gcc,    dep: 'build-essential cmake libasound2-dev' }
          - { os: windows-latest, cxx: g++,      cc: gcc,    dep: '' }
    runs-on: ${{matrix.os}}
    steps:
    - name: Install Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{matrix.dep}}

    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{matrix.cxx}} -DCMAKE_C_COMPILER=${{matrix.cc}} -DBUILD_TESTING=OFF
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{matrix.cxx}} -DCMAKE_C_COMPILER=${{matrix.cc}}
        fi
      shell: bash

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      if: runner.os == 'Linux'
      run: cmake --build build --config Release --target test
