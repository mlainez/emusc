name: emuscd CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ '*' ]
  create:
      tags: ['v*']

jobs:
  build:
    # Windows binaries are cross-compiled with MinGW-w64 from ubuntu-latest,
    # not built natively on windows-latest: a native Windows runner defaults
    # to the Visual Studio generator, which ignores CMAKE_CXX_COMPILER/
    # CMAKE_C_COMPILER, so a workflow that asks it for g++/gcc silently gets
    # something else (or nothing). Cross-compiling is also how both a 64-bit
    # and a 32-bit .exe get built without a second runner OS.
    strategy:
      matrix:
        include:
          - name: linux
            dep: 'build-essential cmake libasound2-dev'
          - name: windows-x64
            dep: 'cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64'
            toolchain: cmake/toolchain-mingw-w64.cmake
            objdump: x86_64-w64-mingw32-objdump
            exe_name: emusc-render.exe
          - name: windows-x86
            dep: 'cmake gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686'
            toolchain: cmake/toolchain-mingw-w32.cmake
            objdump: i686-w64-mingw32-objdump
            exe_name: emusc-render32.exe
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{matrix.dep}}

    - name: Configure CMake (native Linux)
      if: matrix.name == 'linux'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

    - name: Configure CMake (Windows cross-compile)
      if: matrix.name != 'linux'
      run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{matrix.toolchain}} -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

    - name: Build
      run: cmake --build build --parallel

    - name: Collect Linux binaries
      if: matrix.name == 'linux'
      run: |
        mkdir -p release
        if [ -f build/emuscd/emuscd ]; then cp build/emuscd/emuscd release/; fi
        if [ -f build/libemusc/tools/emusc-render ]; then cp build/libemusc/tools/emusc-render release/; fi
      shell: bash

    # Named per architecture (emusc-render.exe / emusc-render32.exe, matching
    # scva-headless's own -render/-render32 convention): the nightly release
    # below flattens every job's artifacts into one asset list, where two
    # files both called emusc-render.exe would collide and one would
    # silently clobber the other.
    - name: Collect Windows binary
      if: matrix.name != 'linux'
      run: |
        mkdir -p release
        cp build/libemusc/tools/emusc-render.exe release/${{matrix.exe_name}}
      shell: bash

    # emuscd is ALSA-only (see the WIN32 guard in the top-level CMakeLists),
    # so there's no Windows daemon to collect. emusc-render is expected to
    # depend on nothing but core Windows DLLs, so it runs on an unmodified
    # Windows 98 install with no MinGW runtime to distribute alongside it.
    - name: Verify Windows binary is self-contained
      if: matrix.name != 'linux'
      run: |
        # grep exits 1 (not an error here) when nothing extra is found, which
        # is the passing case - the || true keeps that from tripping the
        # step's own set -e before the if below gets to look at $deps.
        deps=$(${{matrix.objdump}} -p release/${{matrix.exe_name}} | grep -i "DLL Name" \
               | grep -viE "kernel32|msvcrt" || true)
        if [ -n "$deps" ]; then
          echo "${{matrix.exe_name}} depends on DLLs beyond the Windows base system:"
          echo "$deps"
          exit 1
        fi
        echo "${{matrix.exe_name}} depends only on core Windows DLLs"
      shell: bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{matrix.name}}-binaries
        path: release/
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    # softprops/action-gh-release only adds/overwrites the files it's given;
    # it never removes an asset that a past run uploaded but the current one
    # doesn't produce. Without this, "nightly" silently accumulates stale
    # binaries from whatever the workflow used to build, forever appearing
    # alongside the current ones. Deleting first makes each nightly an exact
    # snapshot of this run. There's nothing to delete on the very first run.
    - name: Delete previous nightly release
      run: gh release delete nightly --yes --cleanup-tag || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create rolling release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: Nightly Build
        prerelease: true
        generate_release_notes: false
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
