name: emuscd CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ '*' ]
  create:
      tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  cxx: g++,      cc: gcc,    dep: 'build-essential cmake libasound2-dev' }
          - { os: windows-latest, cxx: g++,      cc: gcc,    dep: '' }
    runs-on: ${{matrix.os}}
    steps:
    - name: Install Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{matrix.dep}}

    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{matrix.cxx}} -DCMAKE_C_COMPILER=${{matrix.cc}} -DBUILD_TESTING=OFF

    - name: Build
      run: cmake --build build --config Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-library
        path: build/libemusc/src/${{ runner.os == 'Windows' && 'Release/emusc.dll' || 'libemusc.a' }}
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create rolling release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: Nightly Build
        prerelease: true
        generate_release_notes: false
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
